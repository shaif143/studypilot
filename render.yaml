# Render Blueprint for the StudyPilot API.
#
# Import this from the Render dashboard (New → Blueprint) and it provisions
# the service with the right build, health check and environment. The values
# marked `sync: false` are the ones only you can supply; Render prompts for
# each one during the import.
#
# The website is NOT here — it deploys to Vercel from the same repository.
# docs/DEPLOYMENT.md walks through both halves in order.

services:
  - type: web
    name: studypilot-api
    runtime: docker
    dockerfilePath: ./services/api/Dockerfile
    # The build context is the repository root, because the Dockerfile copies
    # from services/api/.
    dockerContext: .
    # Pick the region closest to your Neon project; every request to the
    # database crosses this gap. frankfurt is the nearest Render region to
    # Neon's aws-eu-west-2 (London) and aws-eu-central-1.
    region: frankfurt
    plan: free
    healthCheckPath: /healthz
    autoDeployTrigger: commit

    envVars:
      - key: STUDYPILOT_DEPLOYMENT_MODE
        value: hosted

      # --- Database (required) ---------------------------------------------
      # Both come from `neon env pull`. "postgres://" and a missing sslmode
      # are corrected automatically, so paste them exactly as Neon gives them.
      #
      # The pooled URL (DATABASE_URL) is PgBouncer in transaction mode and is
      # what ordinary requests use.
      - key: STUDYPILOT_DATABASE_URL
        sync: false
      # The direct URL (DATABASE_URL_UNPOOLED) is required as well, and is not
      # optional on Neon: schema creation, `CREATE EXTENSION` and index builds
      # hold session state that a transaction pooler does not carry, so they
      # run on this connection instead. Leaving it blank makes the first boot
      # fail while building the vector index.
      - key: STUDYPILOT_DATABASE_URL_DIRECT
        sync: false

      # --- Identity (required) ---------------------------------------------
      # `neon` delegates sign-in to Neon Auth: the browser gets an EdDSA JWT
      # and this service verifies it against the published JWKS. Set `builtin`
      # instead to use this application's own email/password accounts — but
      # see the CORS note below, because cookie sessions need one origin.
      - key: STUDYPILOT_AUTH_PROVIDER
        value: neon
      # Both printed by `neon env pull`. The issuer is derived from the host
      # of these, so paste them unaltered.
      - key: NEON_AUTH_BASE_URL
        sync: false
      - key: NEON_AUTH_JWKS_URL
        sync: false

      # Signs session cookies for the built-in provider. Unused under Neon
      # Auth — Neon signs — but generated here so switching providers later
      # does not need a redeploy. Render keeps it stable across deploys;
      # regenerating it would sign everyone out.
      - key: STUDYPILOT_JWT_SECRET
        generateValue: true

      # --- Where the website lives (required) -------------------------------
      # The site is on Vercel and this API is on Render, so they are different
      # origins and the browser needs to be told this one accepts the other.
      # Comma-separated, scheme included, no trailing slash. A wildcard is
      # refused. Credentials are never allowed, which is why the Neon Auth
      # bearer token is the identity that works here: a browser will not send
      # a cookie cross-origin.
      #
      #   https://studypilot-swart-theta.vercel.app,https://studypilot-shaifs-projects.vercel.app
      #
      # Leave this blank if you put the site and the API behind one hostname.
      - key: STUDYPILOT_CORS_ORIGINS
        sync: false

      # --- Storage ----------------------------------------------------------
      # The vector index lives inside the same PostgreSQL database, which is
      # why there is no separate search service to provision.
      - key: STUDYPILOT_VECTOR_STORE
        value: pgvector

      # Uploaded PDFs. `local` writes them to the container's own disk, which
      # on a free instance is wiped whenever it sleeps or redeploys: the rows
      # survive in Neon, the files do not, and the reader then cannot open a
      # document it still lists. The service says so at boot and keeps
      # running, because that is a reasonable way to try the thing out — but
      # it is not a way to keep anything.
      #
      # For durable storage, change this to `s3` and add the five variables
      # below in the Render dashboard. They are left out of the blueprint on
      # purpose, so the import does not ask for five secrets you may not have
      # yet. Any S3-compatible provider works: Neon Object Storage when your
      # project is in a region that offers it (not aws-eu-west-2), otherwise
      # Cloudflare R2, Backblaze B2 or AWS S3.
      #
      #   STUDYPILOT_S3_BUCKET      the bucket name
      #   AWS_ENDPOINT_URL_S3       the bucket endpoint (Neon's own name for it)
      #   AWS_ACCESS_KEY_ID
      #   AWS_SECRET_ACCESS_KEY
      #   AWS_REGION                `auto` for R2; a real region elsewhere
      - key: STUDYPILOT_STORAGE_BACKEND
        value: local

      # Scratch space for temporary downloads during ingestion. Nothing here
      # needs to survive a restart.
      - key: STUDYPILOT_DATA_DIR
        value: /tmp/studypilot

      # --- Behaviour --------------------------------------------------------
      # Default: no generation. The tutor quotes your own material with
      # citations and says so. Set to anthropic or openai (plus the matching
      # API key) for written explanations.
      - key: STUDYPILOT_LLM_PROVIDER
        value: extractive

      # Free instances have 512 MB of RAM. Rendering previews for a very large
      # PDF is the memory-hungry part, so the upload cap is lowered to match;
      # raise it if you move to a paid instance.
      - key: STUDYPILOT_MAX_UPLOAD_BYTES
        value: "26214400"

      - key: STUDYPILOT_LOG_LEVEL
        value: INFO
      # Leave false: document text, questions and answers are redacted.
      - key: STUDYPILOT_LOG_SENSITIVE_CONTENT
        value: "false"

      # Under Neon Auth this governs the application's own registration
      # screen; Neon's own sign-up settings are separate. Turn it off once
      # your account exists, or anyone who finds the URL can sign up.
      - key: STUDYPILOT_ALLOW_REGISTRATION
        value: "true"
