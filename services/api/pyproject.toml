[project]
name = "studypilot-api"
version = "0.1.0"
description = "StudyPilot local-first learning backend"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "pymupdf>=1.24",
  "qdrant-client>=1.12",
  "langgraph>=0.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
# Everything a hosted deployment needs that the desktop build does not:
# PostgreSQL, object storage, and account authentication.
hosted = [
  "psycopg[binary]>=3.2",
  "boto3>=1.35",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
]
# Static distilled embeddings: ~30 MB, CPU-only, no PyTorch. Recommended.
local-models = ["model2vec>=0.3"]
# Full transformer encoders. Best local quality, ~1 GB install.
strong-models = ["sentence-transformers>=3.0"]
dev = [
  "pytest>=8.3",
  # The hosted extras are dev dependencies too: the auth and storage tests
  # exercise them regardless of which mode is being built.
  "psycopg[binary]>=3.2",
  "boto3>=1.35",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "pyinstaller>=6.11",
  "reportlab>=4.2",
  # Simulates S3 in-process, so the object-store tests need no Docker.
  "moto[s3]>=5.0",
]

[project.scripts]
studypilot-api = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PL", "RUF"]
ignore = [
  "PLR0913",  # domain services legitimately take many keyword arguments
  "PLR0917",  # ditto: keyword-only service signatures are clearer than objects
  "PLR0912",  # branchy but linear pipeline code reads better flat
  "PLR0915",
  "PLR0911",
  "PLR2004",
  "B008",     # FastAPI's Depends()/File() defaults are the documented pattern
  "PLC0415",  # deferred imports break genuine import cycles and keep optional
              # model dependencies out of the import path
  "RUF001",   # en dashes and typographic characters in user-facing strings
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
