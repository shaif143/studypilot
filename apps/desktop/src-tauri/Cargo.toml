[package]
name = "studypilot"
version = "0.1.0"
description = "StudyPilot — a privacy-first university learning companion"
authors = ["StudyPilot"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "studypilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["macos-private-api"] }
tauri-plugin-shell = "2.6.0"
tauri-plugin-opener = "2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
base64 = "0.22"
tokio = { version = "1", features = ["time"] }
ureq = { version = "2", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
